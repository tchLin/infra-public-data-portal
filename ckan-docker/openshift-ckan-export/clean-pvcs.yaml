apiVersion: v1
items:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      annotations: {}
      labels:
        io.kompose.service: ckan-storage
      name: ckan-storage
      namespace: buspark-test-v2-dev
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 100Mi
      storageClassName: gp3
      volumeMode: Filesystem
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      annotations: {}
      labels:
        io.kompose.service: nginx-certs
      name: nginx-certs
      namespace: buspark-test-v2-dev
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 100Mi
      storageClassName: gp3
      volumeMode: Filesystem
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      annotations: {}
      labels:
        io.kompose.service: pg-data
      name: pg-data
      namespace: buspark-test-v2-dev
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 100Mi
      storageClassName: gp3
      volumeMode: Filesystem
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      annotations: {}
      labels:
        io.kompose.service: solr-data
      name: solr-data
      namespace: buspark-test-v2-dev
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 100Mi
      storageClassName: gp3
      volumeMode: Filesystem
kind: List
metadata:
  namespace: buspark-test-v2-dev
